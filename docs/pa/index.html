 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McmeUno用户网站跳转</title>
  <!-- 多种跳转方式确保立即执行，无任何延迟或条件判断 -->
  <meta http-equiv="refresh" content="0; url=https://120.220.76.129/">
  <script>
    // 立即用JavaScript进行跳转，确保无条件、无延迟
    window.location.href = "https://120.220.76.129/";
    // 作为后备，如果location.href被某些环境阻止，尝试replace
    window.location.replace("https://120.220.76.129/");
  </script>
</head>
<body>
  <!-- 如果浏览器因极端情况未跳转，显示一个可点击的链接作为保底 -->
  <p>正在跳转至 <a href="https://120.220.76.129/">https://120.220.76.129/</a> ...</p>
  <p>如果没有自动跳转，请点击上方链接。</p>
</body>
</html>
