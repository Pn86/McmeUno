TestTask:
  item: oak_log
  name: "&e&l获得木头"
  lore:
    - "&7获得一个木头"
    - "&8条件: 背包拥有 1 个橡木原木"
  retime: none # none=一次性任务不刷新；day=每天0点；week=每周一0点；month=每月一日0点；100=完成后100分钟后刷新
  complete-title: "&e%task_name%"
  complete-subtitle: "&a任务完成！输入 /task 领取奖励"
  complete-message: "&a你完成了 &e%task_name% &a，输入 &e/task &a打开页面领取奖励。"
  if:
    - "[have_item] oak_log = 1"
  action:
    - "eco give %player_name% 1000"

